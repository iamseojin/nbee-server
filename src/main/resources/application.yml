server:
  port: 7070
  address: 0.0.0.0
spring:
  datasource:
    url: ${DB_URL}
    username: admin
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create #update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html